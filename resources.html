<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resources & Useful Links</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
background: linear-gradient(135deg, #FFFAF3 0%,#EFE9E3 100%);            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25), 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header-section .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ea6966 0%, #764ba2 100%);
            border-radius: 20px;
            margin-bottom: 1rem;
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .header-section .icon-wrapper i {
            font-size: 2.5rem;
            color: #fff;
        }

        .header-section h2 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .header-section p {
            color: #6c7a8e;
            font-size: 1.05rem;
            font-weight: 400;
            max-width: 450px;
            margin: 0 auto;
        }

        .resources-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1.2rem 1.8rem;
            background: #f8faff;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #edf2f7;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .resource-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #667eea, #764ba2);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .resource-item:hover {
            transform: translateX(8px) scale(1.01);
            background: #ffffff;
            border-color: #667eea;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.15);
        }

        .resource-item:hover::before {
            opacity: 1;
        }

        .resource-item .icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 14px;
            font-size: 1.4rem;
            color: #fff;
            transition: transform 0.3s ease;
        }

        .resource-item:hover .icon-box {
            transform: scale(1.05) rotate(-3deg);
        }

        .icon-box.purple {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .icon-box.blue {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .icon-box.green {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }

        .icon-box.orange {
            background: linear-gradient(135deg, #fa709a, #fee140);
        }

        .icon-box.red {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .resource-item .content {
            flex: 1;
            min-width: 0;
        }

        .resource-item .content .title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .resource-item .content .description {
            font-size: 0.9rem;
            color: #6c7a8e;
            margin-top: 0.15rem;
        }

        .resource-item .badge {
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: #edf2f7;
            color: #4a5568;
            white-space: nowrap;
        }

        .badge.pdf {
            background: #fee2e2;
            color: #dc2626;
        }

        .badge.video {
            background: #dbeafe;
            color: #2563eb;
        }

        .badge.app {
            background: #d1fae5;
            color: #059669;
        }

        .badge.api {
            background: #fef3c7;
            color: #d97706;
        }

        .resource-item .arrow {
            color: #cbd5e0;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .resource-item:hover .arrow {
            color: #667eea;
            transform: translateX(4px);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
            margin: 0.5rem 0;
        }

        .footer-section {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-section .stats {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .footer-section .stats span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #6c7a8e;
        }

        .footer-section .stats span i {
            color: #667eea;
            font-size: 1rem;
        }

        .footer-section .last-updated {
            font-size: 0.8rem;
            color: #a0aec0;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 1.5rem;
                border-radius: 16px;
            }

            .header-section h2 {
                font-size: 1.6rem;
            }

            .header-section .icon-wrapper {
                width: 60px;
                height: 60px;
            }

            .header-section .icon-wrapper i {
                font-size: 2rem;
            }

            .resource-item {
                padding: 1rem 1.2rem;
                flex-wrap: wrap;
                gap: 0.8rem;
            }

            .resource-item .icon-box {
                width: 44px;
                height: 44px;
                min-width: 44px;
                font-size: 1.1rem;
            }

            .resource-item .content .title {
                font-size: 0.95rem;
            }

            .resource-item .badge {
                font-size: 0.6rem;
                padding: 0.2rem 0.7rem;
            }

            .footer-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .footer-section .stats {
                flex-wrap: wrap;
                gap: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header-section">
            <div class="icon-wrapper">
                <i class="fas fa-layer-group"></i>
            </div>
            <h2>Resources &amp; Useful Links</h2>
            <p>Quick access to essential documentation, tutorials, and downloads</p>
        </div>

        <!-- Resources Grid -->
        <div class="resources-grid">

            <!-- PDF Link -->
            <a href="https://efactor.tech/docs/Efactor_Studio_Add_ui.pdf" target="_blank" class="resource-item">
                <div class="icon-box purple">
                    <i class="fas fa-file-pdf"></i>
                </div>
                <div class="content">
                    <div class="title">
                        View API Form PDF
                        <span class="badge pdf">PDF</span>
                    </div>
                    <div class="description">Complete API documentation and form guide</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <!-- Video Link -->
            <a href="https://efactor.tech/docs/in-out_status_demo.mp4" target="_blank" class="resource-item">
                <div class="icon-box blue">
                    <i class="fas fa-play"></i>
                </div>
                <div class="content">
                    <div class="title">
                        Watch Tutorial Video
                        <span class="badge video">Video</span>
                    </div>
                    <div class="description">Step-by-step tutorial on device integration</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <!-- Application Link -->
            <a href="https://yourappdownload.com" target="_blank" class="resource-item">
                <div class="icon-box green">
                    <i class="fas fa-download"></i>
                </div>
                <div class="content">
                    <div class="title">
                        Download Application
                        <span class="badge app">APK</span>
                    </div>
                    <div class="description">Latest version of the Efactor mobile app</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            

        
    </div>

</body>
</html>
